<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;border:0;padding:0;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #F2A541;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.f{fill:currentColor;stroke:none}
.vol{-webkit-appearance:none;appearance:none;height:44px;margin:0;background:transparent;cursor:pointer}
.vol::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#F2A541 var(--v),#2C3038 var(--v))}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#F2F1EE;border:0}
.vol::-moz-range-track{height:6px;border-radius:3px;background:#2C3038}
.vol::-moz-range-progress{height:6px;border-radius:3px;background:#F2A541}
.vol::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#F2F1EE;border:0}
.pill:focus-within{box-shadow:0 0 0 2px #F2A541}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #F2F1EE; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 16px 12px 0; display: flex; align-items: center">
<a href="Main.dc.html" style="height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 4px; font-size: 15px; color: #C9CBD1">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
Rooms
</a>
</div>

<div style="margin: 8px 20px 0; height: 248px; border-radius: 28px; background: #2A1F10; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(242, 165, 65, 0.14)"></div>
<div style="position: absolute; width: 276px; height: 276px; border-radius: 50%; border: 1px solid rgba(242, 165, 65, 0.24)"></div>
<div style="position: absolute; width: 176px; height: 176px; border-radius: 50%; border: 1px solid rgba(242, 165, 65, 0.38)"></div>
<div style="position: relative; width: 92px; height: 92px; border-radius: 50%; background: #F2A541; color: #1A1206; display: flex; align-items: center; justify-content: center">
<svg class="i" style="width: 42px; height: 42px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"></path></svg>
</div>
<span style="position: absolute; left: 16px; bottom: 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F2D3A4; background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 5px 8px">Live stream</span>
</div>

<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Radio Paradise</h1>
<p style="margin: 0; font-size: 14px; color: #9A9DA6">Stream · stream.radioparadise.com</p>
<div style="margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px">
<span style="display: flex; align-items: center; gap: 6px; font-weight: 600; color: #F2A541; background: #2A1F10; border-radius: 999px; padding: 4px 10px">
<span style="width: 6px; height: 6px; border-radius: 50%; background: #F2A541"></span>
Playing
</span>
<span style="color: #9A9DA6">on Downstairs · Living Room + Kitchen</span>
</div>
</div>

<div style="padding: 24px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="display: flex; justify-content: center; align-items: flex-start; gap: 40px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 76px">
<button aria-label="Stop" style="width: 76px; height: 76px; border-radius: 38px; background: #F2A541; color: #1A1206; display: flex; align-items: center; justify-content: center">
<svg class="i f" style="width: 28px; height: 28px" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
</button>
<span style="font-size: 12px; color: #9A9DA6">Stop</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px">
<a href="Transfer.dc.html" aria-label="Move to room" style="width: 76px; height: 76px; border-radius: 38px; background: #17191E; color: #F2F1EE; display: flex; align-items: center; justify-content: center">
<svg class="i" style="width: 28px; height: 28px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6"></path></svg>
</a>
<span style="font-size: 12px; color: #9A9DA6; white-space: nowrap">Move to room…</span>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #9A9DA6">Live streams can't be paused</p>
</div>

<section style="margin: 24px 20px 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<div class="pill" style="position: relative; flex-grow: 1; height: 52px; margin: 0; border-radius: 26px; background: #22252B; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{groupV}}; background: #4A3412"></div>
<div style="position: absolute; inset: 0; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg class="i" style="color: #F2A541" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>Downstairs</span>
<span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{group}}%</span>
</div>
<input type="range" aria-label="Downstairs volume" min="0" max="100" value="{{group}}" onChange="{{setGroup}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
</div>
<button aria-label="{{muteLabel}}" onClick="{{toggleMute}}" style="width: 52px; height: 52px; border-radius: 26px; flex-shrink: 0; background: #17191E; color: #C9CBD1; display: flex; align-items: center; justify-content: center">
<sc-if value="{{muted}}" hint-placeholder-val="{{ false }}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9l5 6M22 9l-5 6"></path></svg>
</sc-if>
<sc-if value="{{unmuted}}" hint-placeholder-val="{{ true }}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"></path></svg>
</sc-if>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div class="pill" style="position: relative; height: 44px; margin: 0; border-radius: 22px; background: #22252B; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{livingV}}; background: #4A3412"></div>
<div style="position: absolute; inset: 0; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none">
<span style="font-size: 14px; color: #E4E3DF">Living Room</span>
<span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{living}}%</span>
</div>
<input type="range" aria-label="Living Room volume" min="0" max="100" value="{{living}}" onChange="{{setLiving}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
</div>
<div class="pill" style="position: relative; height: 44px; margin: 0; border-radius: 22px; background: #22252B; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{kitchenV}}; background: #4A3412"></div>
<div style="position: absolute; inset: 0; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none">
<span style="font-size: 14px; color: #E4E3DF">Kitchen</span>
<span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{kitchen}}%</span>
</div>
<input type="range" aria-label="Kitchen volume" min="0" max="100" value="{{kitchen}}" onChange="{{setKitchen}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize">
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { group: 62, living: 70, kitchen: 55, muted: false };
  }
  renderVals() {
    const s = this.state;
    const vol = (k) => (e) => this.setState({ [k]: +e.target.value });
    return {
      group: s.group, groupV: s.group + '%', setGroup: vol('group'),
      living: s.living, livingV: s.living + '%', setLiving: vol('living'),
      kitchen: s.kitchen, kitchenV: s.kitchen + '%', setKitchen: vol('kitchen'),
      muted: s.muted,
      unmuted: !s.muted,
      muteLabel: s.muted ? 'Unmute Downstairs' : 'Mute Downstairs',
      toggleMute: () => this.setState({ muted: !s.muted })
    };
  }
}
</script>
</body>
</html>
