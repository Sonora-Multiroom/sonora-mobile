<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move playback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;border:0;padding:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #F2A541;outline-offset:2px}
input[type=radio]:focus-visible{outline:2px solid #F2A541;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #F2F1EE; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden">

<div aria-hidden="true" style="padding: 76px 20px 0">
<div style="height: 248px; border-radius: 28px; background: #2A1F10; display: flex; align-items: center; justify-content: center">
<div style="width: 92px; height: 92px; border-radius: 50%; background: #F2A541"></div>
</div>
<div style="margin-top: 20px; width: 200px; height: 26px; border-radius: 8px; background: #22252B"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(5, 6, 8, 0.72)"></div>

<section role="dialog" aria-labelledby="move-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 768px; box-sizing: border-box; background: #17191E; border-radius: 28px 28px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3E46"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="move-title" style="margin: 0; font-family: Sora, sans-serif; font-size: 22px; font-weight: 600">Move playback</h2>
<p style="margin: 0; font-size: 14px; color: #9A9DA6">Radio Paradise · now on Downstairs</p>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9A9DA6">Move to</legend>
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<label style="min-height: 58px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; cursor: {{o.cursor}}; opacity: {{o.opacity}}; background: {{o.rowBg}}; box-shadow: inset 0 0 0 1px {{o.ring}}">
<div style="width: 38px; height: 38px; border-radius: 10px; background: #22252B; color: #C9CBD1; display: flex; align-items: center; justify-content: center">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><circle cx="12" cy="14" r="3"></circle><circle cx="12" cy="7" r="1"></circle></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
<span style="font-size: 12px; color: {{o.subColor}}">{{o.sub}}</span>
</div>
<input type="radio" name="dest" checked="{{o.checked}}" disabled="{{o.disabled}}" onChange="{{o.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #F2A541">
</label>
</sc-for>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9A9DA6">Groups</legend>
<sc-for list="{{groups}}" as="o" hint-placeholder-count="2">
<label style="min-height: 58px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; cursor: {{o.cursor}}; opacity: {{o.opacity}}; background: {{o.rowBg}}; box-shadow: inset 0 0 0 1px {{o.ring}}">
<div style="width: 38px; height: 38px; border-radius: 10px; background: #22252B; color: #C9CBD1; display: flex; align-items: center; justify-content: center">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="8" height="14" rx="1.5"></rect><circle cx="6.5" cy="13.5" r="2"></circle><rect x="13.5" y="5" width="8" height="14" rx="1.5"></rect><circle cx="17.5" cy="13.5" r="2"></circle></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
<span style="font-size: 12px; color: {{o.subColor}}">{{o.sub}}</span>
</div>
<input type="radio" name="dest" checked="{{o.checked}}" disabled="{{o.disabled}}" onChange="{{o.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #F2A541">
</label>
</sc-for>
</fieldset>
</div>

<p style="margin: auto 0 0; font-size: 13px; color: #9A9DA6; display: flex; align-items: center; gap: 8px">
<svg class="i" style="width: 16px; height: 16px; color: #5FD3C4" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
Keeps playing while it moves, no restart
</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<button style="height: 56px; border-radius: 28px; background: #F2A541; color: #1A1206; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6"></path></svg>
{{cta}}
</button>
<a href="NowPlaying.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #C9CBD1">Cancel</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dest: 'bedroom' };
  }
  renderVals() {
    const s = this.state;
    const opts = [
      { id: 'bedroom', name: 'Bedroom', sub: 'Idle' },
      { id: 'office', name: 'Office', sub: 'Morning playlist will stop', warn: true },
      { id: 'living', name: 'Living Room only', sub: 'Kitchen stops' },
      { id: 'kitchen', name: 'Kitchen only', sub: 'Living Room stops' },
      { id: 'patio', name: 'Patio', sub: 'Turned off', disabled: true }
    ];
    const groupOpts = [
      { id: 'upstairs', name: 'Upstairs', sub: 'Morning playlist will stop', warn: true },
      { id: 'outdoor', name: 'Outdoor', sub: 'Turned off', disabled: true }
    ];
    const toRow = (x) => {
      const on = x.id === s.dest;
      return {
        name: x.name, sub: x.sub, checked: on, disabled: !!x.disabled,
        subColor: x.warn ? '#F2D3A4' : '#9A9DA6',
        cursor: x.disabled ? 'not-allowed' : 'pointer', opacity: x.disabled ? '0.5' : '1',
        rowBg: on ? '#1F1A12' : 'transparent', ring: on ? '#6B4C1F' : 'transparent',
        pick: () => this.setState({ dest: x.id })
      };
    };
    const options = opts.map(toRow);
    const groups = groupOpts.map(toRow);
    const dest = opts.concat(groupOpts).find((x) => x.id === s.dest);
    return { options, groups, cta: 'Move to ' + dest.name.replace(' only', '') };
  }
}
</script>
</body>
</html>
