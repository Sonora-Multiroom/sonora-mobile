appId: sonora.multiroom.mobile
name: "ST01 Settings shows the hub and each room's status"
tags: [settings]
onFlowStart:
  - runFlow: ../common/cleanup.yaml
onFlowComplete:
  - runFlow: ../common/cleanup.yaml
---
- runScript: { file: ../../hub.js, env: { ACTION: "start", INPUT: "${STREAM_ID}", TARGET: "${SOLO_ID}", TYPE: "SINGLE_OUTPUT" } }
- launchApp
- tapOn: Settings
- tapOn: { text: Rooms, index: 0 }
- assertVisible: "Hub connection: Connected, ${HUB}. Change address"
- assertVisible: { text: "Playing · ${STREAM_NAME}", below: "${SOLO_NAME}" }
- assertVisible: "Sonora .* Build .*"
