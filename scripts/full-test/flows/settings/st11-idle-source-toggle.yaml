appId: sonora.multiroom.mobile
name: "ST11 An idle source turns off and on in one tap, without a dialog"
tags: [settings]
onFlowStart:
  - runFlow: ../common/cleanup.yaml
onFlowComplete:
  - runFlow: ../common/cleanup.yaml
---
- launchApp
- tapOn: Settings
- tapOn: { text: Sources, index: 0 }
- scrollUntilVisible: { element: "${STREAM_NAME}", centerElement: true }
- tapOn: ${STREAM_NAME}
- assertNotVisible: "Turn off ${STREAM_NAME}\\?"
- retry:
    maxRetries: 3
    commands:
      - runScript: { file: ../../hub.js, env: { ACTION: "expectEnabled", KIND: "inputs", ID: "${STREAM_ID}", ENABLED: "false" } }
- tapOn: ${STREAM_NAME}
- retry:
    maxRetries: 3
    commands:
      - runScript: { file: ../../hub.js, env: { ACTION: "expectEnabled", KIND: "inputs", ID: "${STREAM_ID}", ENABLED: "true" } }
